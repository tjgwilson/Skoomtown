<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skoomtown 2026 - Enter Password</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: url('assets/images/space_warp.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            filter: none;
        }

        #login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
            background: rgba(0, 0, 0, 0.05);
        }

        .login-container-inner {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }
    </style>

<body>
<div id="login-container">
    <div class="login-container-inner">
        <h1>Enter Password</h1>
        <input type="password" id="password" placeholder="Password">
        <button id="login-button">Login</button>
        <p data-id="alert" style="display:none;color:red;">Incorrect password, please try again.</p>
    </div>
</div>

<script src="assets/js/sha1.js"></script>
